# Preserve the original protocol from the upstream proxy (Coolify/Traefik
# terminates TLS, then talks HTTP to this container). Without this, $scheme
# is "http" and the backend marks the request insecure — so the secure session
# cookie is never set and login silently fails behind HTTPS.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;

  # Admin draw.io library uploads are sent as JSON-wrapped XML. Keep this above
  # the server's 10 MiB file guard so nginx does not reject valid uploads first.
  client_max_body_size 20m;

  root /usr/share/nginx/html;
  index index.html;

  # API + OAuth → backend. Same-origin so session cookies just work.
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    # Diagram generation can take a while.
    proxy_read_timeout 300s;
  }

  location /auth/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
