    <rect x="786" y="368" width="52" height="40" rx="13" fill="#A855F7" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M742 344v24h44" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="657" y="394" width="112" height="28" rx="14" fill="#F1EFFF" stroke="#D9D4FF"/>
    <text x="678" y="414" fill="#5B4BD6" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">draw.io</text>
    <path d="M660 184h174M660 442h174" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
