services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      LLM_MODEL: ${LLM_MODEL:-minimaxai/minimax-m2.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-1}
      LLM_TOP_P: ${LLM_TOP_P:-0.95}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      MAX_VISUALIZATIONS_PER_ACCOUNT: ${MAX_VISUALIZATIONS_PER_ACCOUNT:-5}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    restart: unless-stopped
    # No host port binding — Coolify's reverse proxy routes to this container.
    # `expose` keeps port 80 internal to the Docker network only.
    expose:
      - "80"
    depends_on:
      - server

volumes:
  pgdata:
